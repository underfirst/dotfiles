"$schema" = 'https://starship.rs/config-schema.json'

format = """
$time\
[](fg:#a3aed2 bg:#394260)\
$directory\
[](fg:#394260 bg:#212736)\
$git_branch\
$git_status\
$git_metrics\
[](fg:#212736 bg:#1d2230)\
$python\
$nodejs\
[](fg:#1d2230)\n\
$character"""


[time]
disabled = false
time_format = "%T"
style = "bg:#769ff0"
format = '[[ $time ](fg:#a0a9cb bg:#a3aed2 )]($style)'

[directory]
style = "fg:#769ff0 bg:#394260"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[character]
success_symbol = '[\$](bold green)'
error_symbol = '[\$](bold red)'


[git_branch]
symbol = ""
style = "bg:#212736"
format = '[[ $branch ](fg:#769ff0 bg:#212736)]($style)'

[git_status]
style = "bg:#212736"
format = '[[($all_status$ahead_behind)](fg:#769ff0 bg:#212736)]($style)'

[git_metrics]
format = '[(\(+$added|-$deleted\))](fg:#769ff0 bg:#212736)'
disabled = false

[python]
symbol = ""
style = "bg:#1d2230"
format = '[[$symbol $virtualenv](fg:#a0a9cb bg:#1d2230) ]($style)'

[nodejs]
symbol = ""
style = "bg:#1d2230"
format = '[[ $symbol ($version) ](fg:#a0a9cb bg:#1d2230) ]($style)'
