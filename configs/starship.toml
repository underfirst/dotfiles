"$schema" = 'https://starship.rs/config-schema.json'

format = """
(fg:a3aed2 bg:#769ff0)
$time\
[](fg:#a3aed2 bg:#394260)\
$directory\
[](fg:#394260 bg:#212736)\
$git_branch\
$git_status\
$git_metrics\
[](fg:#212736)\n\
$character"""

[directory]
style = "fg:#a3aed2 bg:#394260"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[character]
success_symbol = '[\$](bold green)'
error_symbol = '[\$](bold red)'


[git_branch]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol $branch ](fg:#212736 bg:#1d2230)]($style)'

[git_status]
style = "bg:#212736"
format = '[[($all_status$ahead_behind )](fg:#212736 bg:#1d2230)]($style)'

[git_metrics]
format = '([+$added](fg:#212736 bg:#1d2230) [~$deleted](fg:#212736 bg:#1d2230)'

[python]
symbol = "🐍 "
style = "bg:#212746"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[time]
disabled = false
time_format = "%R"                                       # Hour:Minute Format
style = "bg:#769ff0"
format = '[[  $time ](fg:#a0a9cb bg:#a3aed2 )]($style)'
