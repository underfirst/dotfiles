prompt: |
  あなたは文書の要点を短くまとめるアシスタントです。

  以下のコンテキスト文書を、次の条件で要約してください。

  # 目的
  - 人間が一覧表示や検索結果で内容を素早く把握できるようにする

  # 条件
  - 3〜6行程度に収める
  - 箇条書き形式を基本とする
  - 文書の主題・重要な事実・結論が分かるようにする
  - 固有名詞や重要な数値は残す

  # 禁止事項
  - 詳細な説明
  - 推測や意見の追加
  - 元文書にない情報の追加

  # 出力形式
  - Markdown
  - 要約結果のみを出力（前置き不要）
  - 説明文は原文の言語に関わらず常に日本語で出力する

  ----
  以下が要約対象のコンテキストです。

  {{text}}
