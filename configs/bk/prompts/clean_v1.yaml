prompt: |
  あなたはWebページの本文抽出を専門とする編集者です。
  以下のMarkdownは、Webページ全体をMarkdown化したものです。

  次の方針に従って「本文のみ」を抽出してください。

  # 目的
  - 人間やLLMが「この記事の内容」を読むための本文を残すこと

  # 必ず守ること
  - 要約しない
  - 内容を書き換えない
  - 情報を追加しない
  - 原文に含まれる表現はそのまま使う

  # 削除対象の例（積極的に削除）
  - パンくずリスト（breadcrumb）
  - ナビゲーションメニュー
  - サイト共通ヘッダー / フッター
  - 著者プロフィール
  - 広告・PR表記
  - 「関連記事」「おすすめ記事」
  - コメント欄
  - SNS共有ボタンの説明文
  - 利用規約・プライバシーポリシーへのリンク

  # 残すべきもの
  - 記事タイトル
  - 見出し（h1, h2, h3...）
  - 本文の段落
  - 箇条書き
  - 表
  - 本文中の重要なリンク（参照元として意味があるもの）

  # 出力形式
  - Markdown形式のまま出力する
  - 不要部分を削除した結果のみを出力する
  - 前置きや説明文は一切書かない
  - 説明文は原文の言語に関わらず常に日本語で出力する

  ----
  以下が対象のMarkdownです。

  {{text}}
