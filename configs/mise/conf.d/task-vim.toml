[tasks.vs]
hide = true
description = "snippets用のNeovim tmuxセッションを開く"
interactive = true
run = '''
#!/usr/bin/env zsh
session=snippets
dir="$HOME/Documents/snippets/"
if ! tmux has-session -t "$session" 2>/dev/null; then
  tmux new-session -d -s "$session" -c "$dir" nvim
fi
if [ -z "$TMUX" ]; then
  tmux attach -t "$session"
else
  tmux switch-client -t "$session"
fi
'''

