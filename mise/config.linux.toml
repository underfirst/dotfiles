[shell_alias]
hx = "eval \"$(cat ~/.zsh_history | fzf)\""
hc = "cat ~/.zsh_history | fzf | xclip -i -selection clipboard"

[bootstrap.packages]
"apt:tzdata" = "latest"
"apt:build-essential" = "latest"
"apt:gcc" = "latest"
"apt:g++" = "latest"
"apt:make" = "latest"
"apt:libffi-dev" = "latest"
"apt:libssl-dev" = "latest"
"apt:zlib1g-dev" = "latest"
"apt:liblzma-dev" = "latest"
"apt:libbz2-dev" = "latest"
"apt:libreadline-dev" = "latest"
"apt:libsqlite3-dev" = "latest"
"apt:libopencv-dev" = "latest"
"apt:tk-dev" = "latest"
"apt:libz-dev" = "latest"
"apt:git" = "latest"
"apt:curl" = "latest"
"apt:ca-certificates" = "latest"
"apt:zsh" = "latest"
"apt:unzip" = "latest"
"apt:ffmpeg" = "latest"
"apt:poppler-utils" = "latest"
"apt:imagemagick" = "latest"
"apt:xclip" = "latest"
