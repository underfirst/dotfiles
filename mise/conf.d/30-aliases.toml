[shell_alias]
c = "clear"
f = "find . -name"
k = "kill"
l = "ls -alh"
m = "mkdir -p"
py = "python"
q = "exit"
t = "tmux"
vi = "nvim"
p = "pueue"
gg = "lazygit"
imcat = "timg -pk --title -W"
ipy = "ipython"
jp = "jupyter notebook"
".." = "cd .."
"..." = "cd ../.."
"...." = "cd ../../.."
"....." = "cd ../../../.."
fps = "ps aux | fzf | awk '{print $2}'"
proot = "cd $(git rev-parse --show-toplevel)"
ei = "eza --icons --git"
ea = "eza -la --icons --git"
ee = "eza -aahl --icons --git"
ls = "ei"
la = "ea"
ll = "ee"
gd = "cd $(ghq list --full-path | fzf)"
